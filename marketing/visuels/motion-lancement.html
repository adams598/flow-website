<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Flow — lancement</title>
  <style>
    @font-face {
      font-family: "Manrope";
      src: url("../../public/brand/fonts/Manrope-variable.ttf") format("truetype");
      font-weight: 200 800;
      font-display: block;
    }
    @font-face {
      font-family: "Inter";
      src: url("../../public/brand/fonts/Inter-variable.ttf") format("truetype");
      font-weight: 100 900;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0c1416;
    }
    .film {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      color: #fffcfa;
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(880px 620px at 82% 12%, rgba(0, 240, 255, 0.14), transparent 58%),
        radial-gradient(760px 560px at 10% 92%, rgba(0, 95, 102, 0.55), transparent 62%),
        linear-gradient(165deg, #10282c 0%, #0c1416 48%, #101614 100%);
    }
    .film::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      opacity: 0.08;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
    }
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: radial-gradient(70% 70% at 50% 46%, transparent 40%, rgba(8, 12, 14, 0.72) 100%);
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
      pointer-events: none;
    }
    .blob.paper {
      width: 640px;
      height: 520px;
      left: -80px;
      top: -160px;
      background: radial-gradient(circle at 40% 40%, rgba(243, 235, 225, 0.55), rgba(243, 235, 225, 0.05) 70%);
      animation: blobA 30s linear both;
    }
    .blob.cyan {
      width: 820px;
      height: 640px;
      right: -180px;
      bottom: -220px;
      background: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.28), rgba(0, 95, 102, 0.05) 68%);
      animation: blobB 30s linear both;
    }
    .orbit {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 980px;
      height: 980px;
      margin: -490px 0 0 -490px;
      border-radius: 50%;
      border: 1px solid rgba(125, 244, 255, 0.16);
      transform: rotateX(68deg);
      animation: orbit 30s linear both;
      pointer-events: none;
    }
    .orbit.b {
      width: 1280px;
      height: 1280px;
      margin: -640px 0 0 -640px;
      border-color: rgba(255, 252, 250, 0.06);
      animation-duration: 30s;
    }
    .stage {
      position: absolute;
      inset: 0;
      z-index: 4;
      perspective: 1500px;
      perspective-origin: 50% 46%;
    }
    .world {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: cam 30s linear both;
    }
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .lock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    .mark {
      width: 84px;
      height: 88px;
      object-fit: contain;
    }
    .word {
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      font-size: 148px;
      line-height: 0.9;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
    }
    .kicker {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fffcfa;
    }
    h1 {
      margin-top: 18px;
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      font-size: 92px;
      line-height: 0.96;
      letter-spacing: -0.045em;
    }
    .lead {
      margin-top: 22px;
      font-size: 32px;
      font-weight: 400;
      color: rgba(255, 252, 250, 0.78);
    }
    .punch {
      margin-top: 28px;
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      font-size: 64px;
      letter-spacing: -0.04em;
      color: #7df4ff;
    }
    .credit {
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.03em;
    }
    .credit span {
      display: inline-block;
      margin-left: 18px;
      font-family: "Inter", sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 252, 250, 0.72);
      transform: translateY(-6px);
    }
    .doors {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }
    .door {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 500px;
      margin-left: -250px;
      transform-style: preserve-3d;
    }
    .bezel {
      height: 312px;
      border-radius: 22px;
      overflow: hidden;
      background: #101816;
      border: 1px solid rgba(125, 244, 255, 0.22);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.42);
    }
    .bezel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .label {
      margin-top: 22px;
      text-align: center;
    }
    .label b {
      display: block;
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.04em;
    }
    .label span {
      display: block;
      margin-top: 6px;
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 252, 250, 0.7);
    }
    .finale .word { font-size: 168px; letter-spacing: 0.16em; text-indent: 0.16em; }
    .tag {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: rgba(255, 252, 250, 0.82);
    }
    .tag em {
      font-style: normal;
      color: #7df4ff;
    }
    .foot {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 6;
    }
    .phone {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -0.03em;
    }
    .phone svg { display: block; }
    .url {
      font-size: 20px;
      font-weight: 500;
      color: rgba(255, 252, 250, 0.72);
    }
    .brand { animation: showBrand 30s linear both; }
    .what { animation: showWhat 30s linear both; }
    .what .punch { animation: showPunch 30s linear both; }
    .who { animation: showWho 30s linear both; }
    .door.site { animation: doorSite 30s linear both; }
    .door.app { animation: doorApp 30s linear both; }
    .door.plat { animation: doorPlat 30s linear both; }
    .finale { animation: showEnd 30s linear both; }
    .foot { animation: showFoot 30s linear both; }
    .sweep {
      position: absolute;
      inset: -20%;
      z-index: 12;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 40%, rgba(125, 244, 255, 0.14) 50%, transparent 60%);
      mix-blend-mode: screen;
      animation: sweep 30s linear both;
    }

    @keyframes cam {
      0% { transform: rotateX(5deg) rotateY(-7deg) translateZ(-50px); }
      12% { transform: none; }
      36% { transform: rotateY(4deg) translateZ(18px); }
      46% { transform: none; }
      80% { transform: rotateY(-3deg) translateZ(12px); }
      88% { transform: none; }
      100% { transform: translateZ(16px); }
    }
    @keyframes blobA {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(80px, 40px, 0) scale(1.08); }
      100% { transform: translate3d(30px, 16px, 0) scale(1.02); }
    }
    @keyframes blobB {
      0% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(-60px, -30px, 0); }
      100% { transform: translate3d(-20px, -10px, 0); }
    }
    @keyframes orbit {
      from { transform: rotateX(68deg) rotateZ(0deg); }
      to { transform: rotateX(68deg) rotateZ(360deg); }
    }
    @keyframes showBrand {
      0% { opacity: 0; transform: translateY(18px); }
      3.2% { opacity: 1; transform: none; }
      8.6% { opacity: 1; }
      11% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes showWhat {
      0%, 9.2% { opacity: 0; transform: translateY(22px); }
      12% { opacity: 1; transform: none; }
      33.5% { opacity: 1; }
      36% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes showPunch {
      0%, 23% { opacity: 0; transform: translateY(16px); }
      26% { opacity: 1; transform: none; }
      33.5% { opacity: 1; }
      36% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes showWho {
      0%, 34.2% { opacity: 0; transform: translateY(14px); }
      37% { opacity: 1; transform: none; }
      44.8% { opacity: 1; }
      47.4% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes doorSite {
      0%, 45.4% { opacity: 0; z-index: 1; transform: translate3d(-540px, 36px, -320px) rotateY(26deg); }
      48.4% { opacity: 1; z-index: 4; transform: translate3d(-470px, 0, 160px) rotateY(14deg) scale(1.08); }
      57.6% { opacity: 1; z-index: 4; transform: translate3d(-470px, 0, 160px) rotateY(14deg) scale(1.08); }
      60.4% { opacity: 0.42; z-index: 1; transform: translate3d(-530px, 8px, -120px) rotateY(22deg) scale(0.94); }
      80.4% { opacity: 0.42; z-index: 1; transform: translate3d(-530px, 8px, -120px) rotateY(22deg) scale(0.94); }
      84% { opacity: 0; z-index: 1; transform: translate3d(-600px, 24px, -420px) rotateY(28deg); }
      100% { opacity: 0; }
    }
    @keyframes doorApp {
      0%, 45.4% { opacity: 0; z-index: 1; transform: translate3d(0, 48px, -360px); }
      48.4% { opacity: 0.42; z-index: 1; transform: translate3d(0, 12px, -110px) scale(0.94); }
      58.2% { opacity: 0.42; z-index: 1; transform: translate3d(0, 12px, -110px) scale(0.94); }
      61% { opacity: 1; z-index: 4; transform: translate3d(0, 0, 180px) scale(1.1); }
      69.2% { opacity: 1; z-index: 4; transform: translate3d(0, 0, 180px) scale(1.1); }
      72% { opacity: 0.42; z-index: 1; transform: translate3d(0, 8px, -90px) scale(0.94); }
      80.4% { opacity: 0.42; z-index: 1; transform: translate3d(0, 8px, -90px) scale(0.94); }
      84% { opacity: 0; z-index: 1; transform: translate3d(0, 30px, -420px); }
      100% { opacity: 0; }
    }
    @keyframes doorPlat {
      0%, 45.4% { opacity: 0; z-index: 1; transform: translate3d(540px, 36px, -320px) rotateY(-26deg); }
      48.4% { opacity: 0.4; z-index: 1; transform: translate3d(530px, 10px, -120px) rotateY(-22deg) scale(0.94); }
      69.2% { opacity: 0.4; z-index: 1; transform: translate3d(530px, 10px, -120px) rotateY(-22deg) scale(0.94); }
      72% { opacity: 1; z-index: 4; transform: translate3d(470px, 0, 170px) rotateY(-14deg) scale(1.08); }
      80.4% { opacity: 1; z-index: 4; transform: translate3d(470px, 0, 170px) rotateY(-14deg) scale(1.08); }
      84% { opacity: 0; z-index: 1; transform: translate3d(600px, 24px, -420px) rotateY(-28deg); }
      100% { opacity: 0; }
    }
    @keyframes showEnd {
      0%, 81.2% { opacity: 0; transform: translateY(20px); }
      85% { opacity: 1; transform: none; }
      100% { opacity: 1; }
    }
    @keyframes showFoot {
      0%, 84% { opacity: 0; }
      88% { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes sweep {
      0% { transform: translate3d(-70%, 0, 0); opacity: 0; }
      8% { opacity: 0.9; }
      16% { transform: translate3d(70%, 0, 0); opacity: 0; }
      78% { opacity: 0; transform: translate3d(-70%, 0, 0); }
      88% { opacity: 0.8; }
      100% { opacity: 0; transform: translate3d(60%, 0, 0); }
    }
  </style>
</head>
<body>
  <article class="film">
    <div class="blob paper" aria-hidden="true"></div>
    <div class="blob cyan" aria-hidden="true"></div>
    <div class="orbit" aria-hidden="true"></div>
    <div class="orbit b" aria-hidden="true"></div>

    <div class="stage">
      <div class="world">
        <section class="scene brand">
          <div class="lock">
            <img class="mark" src="../../public/brand/flow-mark.png" alt="" />
            <p class="word">FLOW</p>
          </div>
        </section>

        <section class="scene what">
          <p class="kicker">Produits digitaux</p>
          <h1>Pour votre métier.</h1>
          <p class="lead">Conçus pour que tout avance.</p>
          <p class="punch">Simplement.</p>
        </section>

        <section class="scene who">
          <p class="credit">Adams Dexter<span>Fondateur</span></p>
        </section>

        <div class="doors">
          <figure class="door site">
            <div class="bezel"><img src="screens/ui-site.png" alt="" /></div>
            <figcaption class="label"><b>Site</b><span>qui vous représente</span></figcaption>
          </figure>
          <figure class="door app">
            <div class="bezel"><img src="screens/ui-app.png" alt="" /></div>
            <figcaption class="label"><b>Application</b><span>pour le quotidien</span></figcaption>
          </figure>
          <figure class="door plat">
            <div class="bezel"><img src="screens/ui-plateforme.png" alt="" /></div>
            <figcaption class="label"><b>Plateforme</b><span>pour vos équipes</span></figcaption>
          </figure>
        </div>

        <section class="scene finale">
          <div class="lock">
            <img class="mark" src="../../public/brand/flow-mark.png" alt="" />
            <p class="word">FLOW</p>
            <p class="tag">Build digital. Make it <em>flow.</em></p>
          </div>
        </section>
      </div>
    </div>

    <footer class="foot">
      <p class="phone">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7.2 3.6h2.1c.4 0 .8.3.9.7l.8 2.6c.1.4 0 .8-.3 1.1L9.2 9.4a12.2 12.2 0 0 0 5.4 5.4l1.4-1.5c.3-.3.7-.4 1.1-.3l2.6.8c.4.1.7.5.7.9v2.1c0 .5-.4 1-1 1C10.8 18.8 5.2 13.2 5.2 4.6c0-.5.4-1 1-1Z" fill="#7DF4FF"/>
        </svg>
        07 49 17 83 91
      </p>
      <p class="url">flowsurmesure.com</p>
    </footer>
    <div class="sweep" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
  </article>
</body>
</html>

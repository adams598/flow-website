<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Image de partage — Flow</title>
  <style>
    @font-face { font-family: "Manrope"; src: url("../../../public/brand/fonts/Manrope-variable.ttf") format("truetype"); font-weight: 200 800; }
    @font-face { font-family: "Inter"; src: url("../../../public/brand/fonts/Inter-variable.ttf") format("truetype"); font-weight: 100 900; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Bannière LinkedIn profil : 1584 × 396. La photo de profil couvre le bas gauche
       (zone ~0-420 px en largeur, moitié basse) : aucun contenu important n'y est placé. */
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #10282c; }
    .b { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: Inter, sans-serif; color: #fffcfa; -webkit-font-smoothing: antialiased;
      background: radial-gradient(700px 360px at 88% 0%, rgba(125,244,255,0.22), transparent 60%), radial-gradient(600px 400px at 0% 100%, rgba(0,40,46,0.6), transparent 60%), linear-gradient(160deg, #1a6a72 0%, #124248 45%, #141816 100%); }
    .b::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>"); }
    svg.shapes { position: absolute; inset: 0; }

    .logo { position: absolute; left: 60px; top: 40px; display: flex; align-items: center; gap: 12px; font: 800 34px Manrope; letter-spacing: -0.04em; }
    .logo svg { width: 40px; height: 40px; }

    .txt { position: absolute; left: 96px; top: 120px; bottom: 70px; width: 580px; display: flex; flex-direction: column; justify-content: center; gap: 14px; z-index: 3; }
    .kick { font: 600 15px Inter; letter-spacing: 0.22em; text-transform: uppercase; color: #005f66; }
    h1 { font: 800 58px/1.02 Manrope; letter-spacing: -0.045em; color: #131313; }
    .pill { display: inline-block; padding: 2px 18px 8px; border-radius: 999px; background: #131313; color: #fffcfa; transform: rotate(-2deg); }
    .sub { font: 500 19px/1.35 Inter; color: #3c3530; }
    .contact { display: flex; gap: 22px; align-items: center; margin-top: 4px; }
    .contact span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: #131313; color: #fffcfa; font: 600 16px Inter; }
    .contact svg { width: 16px; height: 16px; color: #7df4ff; }

    /* Appareils : tablette (dalle, comme les affiches) + téléphone 3D. */
    .slab { position: absolute; z-index: 4; left: 720px; top: 150px; width: 330px; height: 207px; border-radius: 20px; padding: 8px;
      background: linear-gradient(155deg, #4a4a4a, #141414 42%, #2a2a2a); box-shadow: 0 30px 46px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.35); transform: rotate(-8deg); }
    .slab .scr { height: 100%; border-radius: 13px; overflow: hidden; background: #fffcfa; position: relative; }
    .slab img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
    .slab .scr::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0.28), transparent 36%, transparent 62%, rgba(255,255,255,0.06)); }
    .phone { position: absolute; z-index: 5; left: 960px; top: 120px; width: 260px; filter: drop-shadow(0 24px 28px rgba(0,0,0,0.45)); }
    .badge { position: absolute; z-index: 6; left: 700px; top: 400px; width: 132px; height: 132px; border-radius: 50%; background: #7df4ff; color: #131313;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(8deg); box-shadow: 0 16px 28px rgba(0,0,0,0.35); }
    .badge::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1.5px dashed rgba(19,19,19,0.45); }
    .badge b { font: 800 30px/1 Manrope; letter-spacing: -0.05em; }
    .badge i { font-style: normal; margin-top: 3px; font: 600 11.5px/1.2 Inter; }
    .tick { position: absolute; z-index: 3; width: 10px; height: 34px; border-radius: 6px; background: #7df4ff; transform: rotate(28deg); left: 1080px; top: 46px; }
    .dot { position: absolute; z-index: 3; width: 8px; height: 8px; border-radius: 50%; background: rgba(125,244,255,0.85); left: 1104px; top: 76px; }
  </style>
</head>
<body>
<div class="b">
  <svg class="shapes" viewBox="0 0 1200 630" aria-hidden="true">
    <defs>
      <linearGradient id="gp" x1="420" y1="0" x2="1100" y2="396" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="0.72" stop-color="#FFFCFA"/><stop offset="1" stop-color="#F3EBE1"/></linearGradient>
      <linearGradient id="gc" x1="900" y1="200" x2="1584" y2="396" gradientUnits="userSpaceOnUse"><stop stop-color="#00C4D0"/><stop offset="0.25" stop-color="#007C88"/><stop offset="1" stop-color="#003E46"/></linearGradient>
      <filter id="lift" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#041416" flood-opacity="0.3"/></filter>
    </defs>
    <path filter="url(#lift)" fill="url(#gc)" d="M620 520 C 780 420, 1060 400, 1220 470 L 1220 660 L 560 660 C 540 600, 560 550, 620 520 Z"/>
    <path filter="url(#lift)" fill="url(#gp)" d="M50 170 C 60 110, 240 96, 420 104 C 600 112, 700 150, 690 260 C 680 380, 640 520, 420 540 C 230 556, 70 530, 52 440 C 40 370, 42 230, 50 170 Z"/>
  </svg>

  <div class="logo">
    <svg viewBox="0 0 256 256" fill="none"><defs><linearGradient id="l" x1="48" y1="18" x2="112" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#C9FDFF"/><stop offset="0.42" stop-color="#2EEAF8"/><stop offset="1" stop-color="#00A8B2"/></linearGradient><linearGradient id="r" x1="150" y1="12" x2="224" y2="248" gradientUnits="userSpaceOnUse"><stop stop-color="#7DF4FF"/><stop offset="0.48" stop-color="#00C4D4"/><stop offset="1" stop-color="#006970"/></linearGradient></defs><path d="M128 16 24 236h54L128 92Z" fill="url(#l)"/><path d="M128 16 232 236h-54L128 92Z" fill="url(#r)"/></svg>
    Flow
  </div>

  <div class="txt">
    <div class="kick">Sites internet · Applications sur mesure</div>
    <h1>Votre site, votre appli.<br>On vous <span class="pill">accompagne.</span></h1>
    <div class="sub">De l’idée à la mise en ligne, avec un seul interlocuteur.</div>
    <div class="contact">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3Z"/></svg>flowsurmesure.com</span>
      <span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.1 3.8c.3-.3.8-.4 1.2-.2l2.2 1c.4.2.6.6.6 1.1l-.2 2.1c0 .3-.2.6-.4.8l-1.2 1.2c1.5 2.4 3.4 4.3 5.8 5.8l1.2-1.2c.2-.2.5-.4.8-.4l2.1-.2c.5 0 .9.2 1.1.6l1 2.2c.2.4.1.9-.2 1.2l-1.3 1.3c-.4.4-1 .6-1.6.5C10.8 19.8 4.2 13.2 3.4 5.7c-.1-.6.1-1.2.5-1.6L7.1 3.8Z"/></svg>07 49 17 83 91</span>
    </div>
  </div>

  <span class="tick"></span><span class="dot"></span>
  <div class="slab"><div class="scr"><img src="screens/ui-site.png" alt=""></div></div>
  <img class="phone" src="screens/phone3d-app.png" alt="">
  <div class="badge"><b>1 mois</b><i>de maintenance<br>offert</i></div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Écran verrouillé — notifications</title>
  <style>
    @font-face { font-family: "Inter"; src: url("/public/brand/fonts/Inter-variable.ttf") format("truetype"); font-weight: 100 900; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Écran 440 × 956 pt. Fond sombre teinté teal (marque, discret). Aucune marque tierce. */
    html, body { width: 440px; height: 956px; overflow: hidden; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }
    #root { position: relative; width: 440px; height: 956px; overflow: hidden;
      background: radial-gradient(380px 420px at 70% 30%, #1f5d64, transparent 70%), radial-gradient(300px 300px at 20% 80%, #0f3a40, transparent 70%), #0b1416; }
    .status { position: absolute; top: 18px; left: 34px; right: 30px; display: flex; justify-content: space-between; font: 600 16px Inter; }
    .clock { position: absolute; top: 120px; left: 0; right: 0; text-align: center; }
    .clock small { display: block; font: 600 20px Inter; opacity: 0.9; }
    .clock b { display: block; font: 300 96px/1 Inter; letter-spacing: -0.03em; }
    .stack { position: absolute; left: 14px; right: 14px; top: 330px; display: flex; flex-direction: column; gap: 9px; }
    .n { display: flex; gap: 12px; padding: 13px 14px; border-radius: 20px; background: rgba(245, 245, 247, 0.86); color: #1c1c1e; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
    .n i { flex: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-style: normal; color: #fff; }
    .n i svg { width: 22px; height: 22px; }
    .n .c { flex: 1; min-width: 0; }
    .n .h { display: flex; justify-content: space-between; font: 600 14px Inter; color: #3a3a3c; }
    .n .h span { font-weight: 400; color: #8e8e93; }
    .n p { margin-top: 2px; font: 500 15px/1.3 Inter; color: #1c1c1e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .count { position: absolute; left: 0; right: 0; top: 860px; text-align: center; font: 600 15px Inter; opacity: 0.85; }
  </style>
</head>
<body>
<div id="root">
  <div class="status"><span>9:41</span><span>●●●● 5G ▮</span></div>
  <div class="clock"><small>Lundi 6 octobre</small><b>9:41</b></div>
  <div class="stack" id="stack"></div>
  <div class="count" id="count"></div>
</div>
<script>
const ICON = {
  call: ['#34c759', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.1 3.8c.3-.3.8-.4 1.2-.2l2.2 1c.4.2.6.6.6 1.1l-.2 2.1c0 .3-.2.6-.4.8l-1.2 1.2c1.5 2.4 3.4 4.3 5.8 5.8l1.2-1.2c.2-.2.5-.4.8-.4l2.1-.2c.5 0 .9.2 1.1.6l1 2.2c.2.4.1.9-.2 1.2l-1.3 1.3c-.4.4-1 .6-1.6.5C10.8 19.8 4.2 13.2 3.4 5.7c-.1-.6.1-1.2.5-1.6L7.1 3.8Z"/></svg>'],
  msg: ['#30a2ff', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4c-4.9 0-9 3.1-9 7 0 2.1 1.2 4 3.1 5.3L5 20l4.2-2.2c.9.2 1.8.3 2.8.3 4.9 0 9-3.1 9-7s-4.1-7-9-7Z"/></svg>'],
  mail: ['#5e9bff', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>'],
};
const N = [
  [0.15, "call", "Téléphone", "Appel manqué · Client (3)"],
  [0.45, "msg", "Messages", "Vous êtes ouverts samedi ?"],
  [0.75, "mail", "Mail", "Relance : devis n° 42 toujours en attente"],
  [1.0, "call", "Téléphone", "Appel manqué · Fournisseur"],
  [1.22, "msg", "Messages", "Vous avez bien reçu mon dossier ?"],
  [1.42, "mail", "Mail", "Facture n° 118 : 2e rappel"],
  [1.6, "call", "Téléphone", "Appel manqué · Numéro inconnu"],
];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
function seek(t) {
  const shown = N.filter((n) => t >= n[0]);
  // La plus récente en haut ; la pile glisse vers le bas.
  document.getElementById("stack").innerHTML = shown.slice().reverse().slice(0, 6).map(([at, k, app, txt], i) => {
    const a = clamp((t - at) / 0.22);
    const e = 1 - Math.pow(1 - a, 3);
    return `<div class="n" style="opacity:${i === 0 ? e : 1};transform:translateY(${i === 0 ? (1 - e) * -40 : 0}px) scale(${i === 0 ? 0.92 + 0.08 * e : 1})"><i style="background:${ICON[k][0]}">${ICON[k][1]}</i><div class="c"><div class="h">${app}<span>maintenant</span></div><p>${txt}</p></div></div>`;
  }).join("");
  document.getElementById("count").textContent = shown.length > 6 ? `+ ${shown.length - 6} notifications` : "";
}
window.seek = seek;
window.__ready = document.fonts.ready;
seek(0);
</script>
</body>
</html>

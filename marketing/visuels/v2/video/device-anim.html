<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Appareil 3D animé</title>
  <style>html, body { margin: 0; background: transparent; overflow: hidden; } canvas { display: block; }</style>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
<script type="module">
/*
 * Tablette ou téléphone 3D, animé par seek(t). Fond transparent.
 * URL : device=tablet|phone, shot=<nom du plan>, seq=<dossier d'images d'écran> | img=<image fixe>,
 *       seqfps=30, seqoff=<décalage s>, w, h (px CSS).
 * Unités : millimètres. Le plan (caméra + pose) est défini dans SHOTS.
 */
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const q = new URLSearchParams(location.search);
const W = +(q.get("w") || 1080), H = +(q.get("h") || 1920);
const DEVICE = q.get("device") || "tablet";
const SHOT = q.get("shot") || "tuto";
const SEQ = q.get("seq"), IMG = q.get("img");
const SEQFPS = +(q.get("seqfps") || 30), SEQOFF = +(q.get("seqoff") || 0), SEQN = +(q.get("seqn") || 1);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.03).texture;

const SPEC = {
  tablet: { BW: 177.5, BH: 249.7, BD: 6.2, BR: 17, SW: 163.2, SH: 163.2 * (1180 / 820), SR: 4.9, bezel: 1.0 },
  phone: { BW: 77.6, BH: 163.4, BD: 8.75, BR: 12.6, SW: 73.0, SH: 73.0 * (956 / 440), SR: 10.6, bezel: 1.1 },
}[DEVICE];
// Paysage : on échange largeur et hauteur ; l'image d'écran est recadrée (cover).
if (q.get("landscape")) { [SPEC.BW, SPEC.BH] = [SPEC.BH, SPEC.BW]; [SPEC.SW, SPEC.SH] = [SPEC.SH, SPEC.SW]; }
const { BW, BH, BD, BR, SW, SH, SR } = SPEC;
const FRONT = BD / 2;

function rounded(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
  s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  return s;
}
function planarUV(g) {
  g.computeBoundingBox();
  const b = g.boundingBox, p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) - b.min.x) / (b.max.x - b.min.x), (p.getY(i) - b.min.y) / (b.max.y - b.min.y));
  return g;
}

const dev = new THREE.Group();
scene.add(dev);
const metal = new THREE.MeshPhysicalMaterial({ color: 0x41545f, metalness: 1, roughness: 0.26, clearcoat: 0.6, clearcoatRoughness: 0.18, envMapIntensity: 1.35 });
const bv = SPEC.bezel;
const frame = new THREE.ExtrudeGeometry(rounded(BW - bv * 2, BH - bv * 2, BR - bv), { depth: BD - bv * 2, bevelEnabled: true, bevelThickness: bv, bevelSize: bv, bevelSegments: 12, curveSegments: 96 });
frame.translate(0, 0, -(BD - bv * 2) / 2);
dev.add(new THREE.Mesh(frame, metal));
const glassM = new THREE.MeshPhysicalMaterial({ color: 0x020304, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.1 });
const glass = new THREE.Mesh(new THREE.ShapeGeometry(rounded(BW - 1.3, BH - 1.3, BR - 0.65), 96), glassM);
glass.position.z = FRONT + 0.05;
dev.add(glass);
const screenMat = new THREE.MeshBasicMaterial({ toneMapped: false });
const screen = new THREE.Mesh(planarUV(new THREE.ShapeGeometry(rounded(SW, SH, SR), 96)), screenMat);
screen.position.z = FRONT + 0.25;
dev.add(screen);
// Reflet du verre.
const g = document.createElement("canvas"); g.width = 512; g.height = 1024;
const c = g.getContext("2d"), gr = c.createLinearGradient(0, 0, 512, 1024);
gr.addColorStop(0, "rgba(255,255,255,0.16)"); gr.addColorStop(0.33, "rgba(255,255,255,0.04)"); gr.addColorStop(0.34, "rgba(255,255,255,0)"); gr.addColorStop(1, "rgba(255,255,255,0.02)");
c.fillStyle = gr; c.fillRect(0, 0, 512, 1024);
const glare = new THREE.Mesh(planarUV(new THREE.ShapeGeometry(rounded(BW - 1.3, BH - 1.3, BR - 0.65), 96)), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(g), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
glare.position.z = FRONT + 0.45;
dev.add(glare);
const btn = (x, y, len, depth = 3.0, out = 0.55, vertical = true) => {
  const m = new THREE.Mesh(vertical ? new RoundedBoxGeometry(out * 2, len, depth, 6, out * 0.9) : new RoundedBoxGeometry(len, out * 2, depth, 6, out * 0.9), metal);
  m.position.set(x, y, 0); dev.add(m);
};
if (DEVICE === "tablet") { btn(BW / 2, BH / 2 - 40, 22, 2.6); btn(BW / 2, BH / 2 - 66, 22, 2.6); btn(-BW / 2 + 40, BH / 2, 22, 2.6, 0.55, false); }
else { btn(-BW / 2, 44, 7.5); btn(-BW / 2, 29, 13); btn(-BW / 2, 13, 13); btn(BW / 2, 26, 20); }

const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-160, 110, 90); scene.add(key);
const rim = new THREE.DirectionalLight(0x7df4ff, 1.4); rim.position.set(140, 40, -40); scene.add(rim);
const fill = new THREE.DirectionalLight(0xfff3e6, 0.6); fill.position.set(-140, -60, 60); scene.add(fill);

const camera = new THREE.PerspectiveCamera(22, W / H, 1, 5000);

// --- Plans : clés [t, rx, ry, rz, distance, décalage x, décalage y] -----------
const SHOTS = {
  // Tutoriel : écran plein cadre (raccord avec le zoom dans le clip), recul en
  // tournant pour montrer l'épaisseur, léger va-et-vient, petit rapproché final.
  tuto: [[0.0, 0.10, -0.18, -0.16, 0.62, 0, 0], [1.1, 0.16, -0.34, -0.06, 1.0, 0, 6], [3.0, 0.12, -0.26, -0.03, 0.96, 0, 4], [5.2, 0.08, 0.18, 0.03, 0.9, 0, 2], [7.9, 0.06, 0.24, 0.05, 0.92, 0, 0]],
  // Tutoriel v2 : la caméra suit l'action (barre d'adresse, recul pendant le
  // défilement, gros plan sur le questionnaire). Temps = st - 0.8 de screen.html.
  tuto2: [[0.0, 0, 0, 0, 0.66, 0, 0], [0.3, 0, 0, 0, 0.66, 0, 0], [0.9, 0.06, -0.10, -0.04, 0.6, -18, 70], [1.5, 0.05, -0.08, -0.03, 0.6, -18, 72],
          [2.1, 0.14, -0.30, -0.05, 0.98, 0, 4], [3.8, 0.10, 0.20, 0.03, 0.95, 0, 2], [4.35, 0.05, 0.10, 0.02, 0.7, -6, 8],
          [7.2, 0.04, 0.13, 0.03, 0.68, -6, 10], [10.4, 0.03, 0.16, 0.04, 0.7, -4, 4]],
  // Offre site : tablette qui entre en pivotant.
  site: [[0.0, 0.6, -1.3, -0.35, 1.7, 0, 40], [1.1, 0.22, -0.4, -0.12, 1.0, 0, 0], [7.8, 0.14, -0.16, -0.08, 0.94, 0, 0]],
  // Offre application : téléphone qui tourne.
  app: [[0.0, -0.3, 1.5, 0.35, 1.7, 0, 40], [1.1, -0.08, -0.5, -0.1, 1.0, 0, 0], [7.6, -0.05, -0.26, -0.06, 0.94, 0, 0]],
};
const keys = SHOTS[SHOT];
const smooth = (x) => x * x * (3 - 2 * x);
function pose(t) {
  let a = keys[0], b = keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++) if (t >= keys[i][0] && t <= keys[i + 1][0]) { a = keys[i]; b = keys[i + 1]; break; }
  if (t <= keys[0][0]) return keys[0].slice(1);
  if (t >= keys[keys.length - 1][0]) return keys[keys.length - 1].slice(1);
  const k = smooth((t - a[0]) / (b[0] - a[0]));
  return a.slice(1).map((v, i) => v + (b[i + 1] - v) * k);
}

// Distance de base : l'appareil entier tient dans le cadre (hauteur et largeur).
const vt = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
const baseDist = Math.max((BH / 2) / vt, (BW / 2) / (vt * camera.aspect)) * 1.12;

const loader = new THREE.TextureLoader();
const cache = new Map();
async function tex(url) {
  if (!cache.has(url)) {
    const t = await loader.loadAsync(url);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const ia = t.image.width / t.image.height, sa = SW / SH;
    if (Math.abs(ia - sa) > 0.01) {
      if (ia > sa) { t.repeat.set(sa / ia, 1); t.offset.set((1 - sa / ia) / 2, 0); }
      else { t.repeat.set(1, ia / sa); t.offset.set(0, (1 - ia / sa) / 2); }
    }
    cache.set(url, t);
    if (cache.size > 6) { const k0 = cache.keys().next().value; cache.get(k0).dispose(); cache.delete(k0); }
  }
  return cache.get(url);
}

let pending = Promise.resolve();
window.seek = (t) => {
  const [rx, ry, rz, d, ox, oy] = pose(t);
  dev.rotation.set(rx, ry, rz, "YXZ");
  camera.position.set(ox, oy, baseDist * d);
  camera.lookAt(ox, oy, 0);
  const url = SEQ ? `${SEQ}/${String(Math.min(SEQN - 1, Math.max(0, Math.round((t + SEQOFF) * SEQFPS)))).padStart(5, "0")}.jpg` : IMG;
  pending = tex(url).then((tx) => { screenMat.map = tx; screenMat.needsUpdate = true; renderer.render(scene, camera); });
};
window.__frameReady = () => pending;
window.__screenQuad = () => {
  dev.updateMatrixWorld(true);
  return [[-SW / 2, SH / 2], [SW / 2, SH / 2], [SW / 2, -SH / 2], [-SW / 2, -SH / 2]].map(([x, y]) => {
    const v = new THREE.Vector3(x, y, FRONT + 0.25).applyMatrix4(dev.matrixWorld).project(camera);
    return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H];
  });
};
window.__ready = Promise.resolve();
window.seek(0);
</script>
</body>
</html>

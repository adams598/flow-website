<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>UI — Application</title>
  <style>
    @font-face { font-family: "Manrope"; src: url("/public/brand/fonts/Manrope-variable.ttf") format("truetype"); font-weight: 200 800; }
    @font-face { font-family: "Inter"; src: url("/public/brand/fonts/Inter-variable.ttf") format("truetype"); font-weight: 100 900; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Lu à ~42 % sur l'affiche : aucun texte utile sous 26 px.
       Application générique « votre entreprise » : chaque métier doit s'y projeter. */
    html, body { width: 1280px; height: 800px; overflow: hidden; background: #f7f4ef; color: #131313; font-family: Inter, sans-serif; }
    body { display: grid; grid-template-columns: 300px 1fr; }
    aside {
      background: #131313; color: #fffcfa; padding: 36px 26px; display: flex; flex-direction: column; gap: 10px;
    }
    .logo { display: flex; align-items: center; gap: 12px; white-space: nowrap; font: 800 26px Manrope, sans-serif; letter-spacing: -0.04em; margin-bottom: 26px; }
    .logo i { width: 34px; height: 34px; border-radius: 10px; border: 3px dashed #7df4ff; }
    aside a {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px;
      color: rgba(255,252,250,0.72); text-decoration: none; font: 600 26px Inter, sans-serif; letter-spacing: -0.02em;
    }
    aside a svg { width: 26px; height: 26px; flex: none; }
    aside a.on { background: #00a8b2; color: #fff; }
    main { padding: 34px 40px; display: flex; flex-direction: column; gap: 24px; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    h1 { font: 800 50px Manrope, sans-serif; letter-spacing: -0.05em; }
    .av { width: 60px; height: 60px; border-radius: 50%; background: #c45e32; color: #fff; display: grid; place-items: center; font: 800 24px Manrope, sans-serif; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .kpi { background: #fff; border: 2px solid #eadfd2; border-radius: 22px; padding: 20px 24px; }
    .kpi span { display: block; font: 600 24px Inter, sans-serif; color: #5c534c; }
    .kpi b { display: block; margin-top: 4px; font: 800 64px/1 Manrope, sans-serif; letter-spacing: -0.05em; }
    .kpi b em { font-style: normal; color: #00a8b2; }
    .rows { background: #fff; border: 2px solid #eadfd2; border-radius: 22px; padding: 6px 24px; flex: 1; }
    .row { display: flex; align-items: center; gap: 18px; padding: 24px 0; border-bottom: 2px solid #f1e9df; }
    .row:last-child { border-bottom: 0; }
    .row .dot { width: 18px; height: 18px; border-radius: 50%; background: #00a8b2; flex: none; }
    .row .dot.wait { background: #c45e32; }
    .row b { font: 700 30px Manrope, sans-serif; letter-spacing: -0.03em; }
    .row .tag { margin-left: auto; padding: 8px 18px; border-radius: 999px; font: 700 22px Inter, sans-serif; background: #e7f8f8; color: #005f66; }
    .row .tag.wait { background: #f8ebe3; color: #9a4520; }
  </style>
</head>
<body>
  <aside>
    <div class="logo"><i></i>Mon entreprise</div>
    <a class="on" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Accueil</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/></svg>Dossiers</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M4 10h16"/></svg>Planning</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.3c2 .3 3.6 1.9 4 4.2"/></svg>Équipe</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>Paiements</a>
  </aside>
  <main>
    <div class="top"><h1>Bonjour Léa</h1><div class="av">L</div></div>
    <div class="kpis">
      <div class="kpi"><span>Dossiers en cours</span><b>24</b></div>
      <div class="kpi"><span>RDV aujourd’hui</span><b>6</b></div>
      <div class="kpi"><span>Payés ce mois</span><b><em>18</em></b></div>
    </div>
    <div class="rows">
      <div class="row"><i class="dot"></i><b>Dossier Martin</b><span class="tag">Validé</span></div>
      <div class="row"><i class="dot wait"></i><b>Devis Atelier Nord</b><span class="tag wait">À signer</span></div>
      <div class="row"><i class="dot"></i><b>Facture n° 128</b><span class="tag">Payée</span></div>
    </div>
  </main>
</body>
</html>
